name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check shell syntax
        run: bash -n bin/obsbot-control tests/test_audio.sh tests/test_helper_build.sh tests/test_protocol.sh tests/test_static.sh

      - name: Build protocol helper
        run: cc -std=c11 -Wall -Wextra -Werror -O2 -D_FORTIFY_SOURCE=3 -fstack-protector-strong -fPIE -pie -Wl,-z,relro,-z,now tools/xu-probe.c -o /tmp/xu-probe

      - name: Test protocol encoding
        run: tests/test_protocol.sh

      - name: Test PipeWire command handling
        run: tests/test_audio.sh

      - name: Test local helper build
        run: tests/test_helper_build.sh

      - name: Check theme safety
        run: |
          if grep -En '#[0-9a-fA-F]{6,8}' ./*.qml; then
            echo 'Fixed UI colors bypass the Omarchy theme' >&2
            exit 1
          fi
